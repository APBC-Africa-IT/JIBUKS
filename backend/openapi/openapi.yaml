openapi: 3.0.3

# ════════════════════════════════════════════════════════════════════
# JiBUks API — OpenAPI specification
#
# This is the machine-readable source of truth, served live via Swagger UI
# at /api/v1/docs on both environments below. docs/api-reference.md is the
# hand-written companion for humans; this file is what drives the
# interactive "Try it out" experience mobile/web teams actually use.
#
# AUTH MODEL (read this before anything else):
# Every endpoint except health checks requires a real, Auth0-issued bearer
# token (constraint C-03 — identity is delegated entirely to Auth0, this
# platform never handles a password). Most endpoints additionally require
# that token's identity to already be a provisioned user in our own
# database — /onboarding is the one deliberate exception, since its whole
# purpose is creating that very first user record.
# ════════════════════════════════════════════════════════════════════

info:
  title: JiBUks API
  version: "1.0"
  description: >
    JiBUks backend API. All endpoints are under /api/v1 (Section 9.1).


    **Authentication.** Every request must carry `Authorization: Bearer
    <token>`, where `<token>` is a genuine, Auth0-issued, RS256-signed JWT.
    Tokens are verified against Auth0's own public keys - this platform
    never sees, stores, or processes a password (constraint C-03). Client
    applications obtain a token via the OAuth 2.0 Authorization Code flow
    (with PKCE) against the Auth0 domain/audience shown under "Servers"
    below, using the real, production-appropriate Auth0 Application
    registered for that client (mobile/web) - never the developer test
    applications used to build this API.


    **Two identity levels.** `POST /onboarding` only requires a *genuine*
    token - it deliberately does not require that identity to already exist
    in our own `users` table, since creating that first record is exactly
    what it does. Every other endpoint requires BOTH a genuine token AND an
    already-provisioned user - an unrecognised identity gets `404
    USER_NOT_FOUND` from those endpoints, not `401`.


    **Tenant scoping.** `X-Tenant-Id` / `X-Actor-User-Id` headers do
    **not** exist in this API and are not accepted - they were an early
    development stand-in, fully retired once real identity was wired in.
    Tenant and actor are always derived from the verified token itself, via
    a server-side lookup keyed on the token's `sub` claim. A client can
    never claim to belong to a tenant that isn't genuinely theirs.

servers:
  - url: https://dev-jibuksapi.apbcafrica.com/api/v1
    description: >
      Staging — hosted, always-on, real HTTPS. Mobile/web teams should
      build against this, not a developer's laptop. Auth0 domain:
      dev-1g8zdrubzj5enqii.us.auth0.com, audience:
      https://api-staging.jibuks.com.
  - url: http://localhost:3000/api/v1
    description: >
      Local development only. Same Auth0 tenant/domain as staging, but
      against the DEV/TEST API's audience (https://apbc.jibuks.com), not
      the staging one - the two audiences are deliberately different, so a
      staging token is never accidentally valid against a developer's
      laptop or vice versa.

tags:
  - name: Onboarding
    description: >
      Self-service sign-up. Creates a brand-new tenant and its first user
      together, atomically (supports FR-MIC-07's minimal-friction merchant
      onboarding). Requires a genuine Auth0 token, but NOT an
      already-provisioned platform user.
  - name: Users
    description: >
      Provisioning additional users into an ALREADY-EXISTING tenant. Always
      requires a fully resolved identity (genuine token + existing user).
  - name: Payments
    description: >
      Mobile-money collection (FR-PAY-01..07). Phase 1: M-Pesa STK push
      ("Lipa na M-Pesa Online") -- the customer gets a PIN prompt on their
      phone; the outcome arrives asynchronously from Safaricom, is
      confirmed with Daraja, then posted to the ledger. Poll
      GET /payments/{id} for the result.
  - name: Provider Callbacks
    description: >
      Called by payment providers, not by apps. No bearer token -- each
      payment's callback URL carries its own secret.
  - name: Roles
    description: >
      Role-based access control (FR-RBAC-01/02). Every tenant endpoint
      requires a specific permission (`module:action`); a caller without it
      gets 403 FORBIDDEN. Five built-in roles (OWNER, ACCOUNTANT, CASHIER,
      VIEWER, AGENT) exist in every tenant and cannot be changed; tenants
      can add custom roles composed from the fixed permission catalogue.
  - name: Invites
    description: >
      Team invitations. An existing tenant user invites someone by email;
      the invitee accepts using their OWN Auth0 identity, which may not
      exist in our system yet -- solving the real gap where nobody knows
      their own Auth0 sub before they've logged in once.
  - name: Accounts
    description: Chart of accounts (FR-COA-01 to FR-COA-04)
  - name: Customers
    description: >
      Customer name list, separate from the chart of accounts. A journal
      line can optionally attribute itself to a customer (mutually
      exclusive with a supplier); balance_minor is the net of POSTED lines
      tagged with that customer, on the debit side (AR-like).
  - name: Suppliers
    description: >
      Supplier name list, separate from the chart of accounts. A journal
      line can optionally attribute itself to a supplier (mutually
      exclusive with a customer); balance_minor is the net of POSTED lines
      tagged with that supplier, on the credit side (AP-like).
  - name: Periods
    description: Accounting periods and locking (FR-ACC-03)
  - name: Journals
    description: Double-entry journal posting and reversal (FR-ACC-01, FR-ACC-02)
  - name: Credit Sales
    description: >
      Guided sales-invoice endpoint (the Sales Day Book entry of manual
      bookkeeping) — a thin, opinionated shape over POST /journals for the
      single most common transaction type. Posts with source SALE.
  - name: Cash Sales
    description: >
      Guided cash-sale endpoint (the Cash Receipts Book entry of manual
      bookkeeping) — payment received immediately, no customer/AR involved.
      Posts with source CASHBOOK.
  - name: Bills
    description: >
      Guided Write Bill endpoint (the Purchases Day Book entry of manual
      bookkeeping) — the supplier-side mirror of Credit Sale. Posts with
      source BILL.
  - name: Cheques
    description: >
      Guided Write Cheque endpoint (the Cash Payments Book entry of manual
      bookkeeping) — a payment OUT, whether clearing a supplier bill,
      paying an expense directly, or both in one cheque. Posts with source
      PAYMENT.
  - name: Cash Expenses
    description: >
      Guided Cash Expense endpoint (the Cash Payments Book entry of manual
      bookkeeping) — the immediate-cash mirror of Write Bill, with no
      supplier/AP involved. Completes the micro-cashbook's sale + expense
      pair alongside Cash Sales. Posts with source CASHBOOK.
  - name: Trial Balance
    description: >
      Read-only report (FR-TB-01): every account's net balance, on its
      natural side, computed from POSTED journal_lines only. Must always
      sum to zero under double entry (isBalanced).
  - name: Profit & Loss
    description: >
      Read-only report (FR-RPT-01): net income/expense activity for a
      date range, computed from POSTED journal_lines only.
  - name: Cash Flow
    description: >
      Read-only report (FR-RPT-01): opening/closing balance and
      inflows/outflows for the given cash/bank account(s) over a date
      range. The simple, direct-method version — not yet categorized into
      Operating/Investing/Financing.

# Applied to every operation by default (see the per-operation overrides on
# the two /onboarding operations, which relax this to "token only").
security:
  - bearerAuth: []

paths:
  # ── Onboarding ──────────────────────────────────────────────────────
  /onboarding:
    post:
      tags: [Onboarding]
      summary: Self-service sign-up — create a tenant and its first user
      description: >
        Public relative to the rest of the API in the sense that no
        pre-existing platform user is required — but a genuine Auth0 token
        IS required (see the global auth note above). The token's `sub`
        claim becomes the new user's `external_idp_subject`.


        Returns 409 USER_ALREADY_EXISTS if this identity has already been
        onboarded or provisioned anywhere on the platform — an identity
        maps to exactly one tenant, permanently.
      security:
        # Overrides the global "bearerAuth" requirement -- functionally
        # identical (still needs a token), documented separately here
        # because Swagger UI's padlock icon and the description above are
        # the cue that THIS endpoint does not additionally require an
        # existing platform user, unlike every other one.
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            example:
              tenantName: "Jane's Kiosk"
              tenantType: "BUSINESS"
              baseCurrency: "KES"
              userName: "Jane Wanjiru"
              vatRegistered: false
              periodStartDate: "2026-09-01"
      responses:
        '201':
          description: >
            Tenant and first user created, plus one OPEN accounting period
            and a starter chart of accounts seeded and ready to use with
            the guided Credit Sale/Cash Sale/Write Bill/Write Cheque
            endpoints immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: This identity has already been onboarded elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "tag:jibuks,2026:error/USER_ALREADY_EXISTS"
                title: "USER_ALREADY_EXISTS"
                status: 409
                detail: "This identity is already onboarded (user ..., tenant ...)"

  # ── Users ─────────────────────────────────────────────────────────
  /users:
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Users]
      summary: Provision a new user into the CALLER'S OWN tenant
      description: >
        The tenant is always taken from the caller's own verified identity
        - never from the request body - so a caller can only ever add users
        to their own business, never anyone else's. The audit log records
        the CALLER as the actor of this action, not the new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              externalIdpSubject: "auth0|..."
              name: "New Teammate"
              email: "teammate@example.com"
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: This identity is already provisioned somewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "tag:jibuks,2026:error/USER_ALREADY_EXISTS"
                title: "USER_ALREADY_EXISTS"
                status: 409
                detail: "A user for this identity already exists (id ...)"
    get:
      tags: [Users]
      summary: List users in the caller's tenant
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags: [Users]
      summary: Get the caller's own user record
      description: >
        Lets a client check whether the current token's identity already
        has a platform account, without guessing locally or reusing
        /onboarding as a de-facto check endpoint. Also returns the caller's
        roles and effective permissions, so the app can hide actions the
        user can't perform (the server still enforces every one). Open to
        any signed-in user -- no permission required.
      responses:
        '200':
          description: The caller's own user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single user
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'

  /users/{id}/roles:
    get:
      tags: [Users]
      summary: List a user's roles
      description: "Requires `users:view`."
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The user's role assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UserNotFound'
    put:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Users]
      summary: Replace a user's roles
      description: >
        Requires `users:edit`. Replaces the user's full set of roles.
        Refused with 422 LAST_OWNER if it would leave the business with no
        active OWNER. Custom roles must exist and be active (else 404
        ROLE_NOT_FOUND).
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserRolesRequest'
            example:
              roles: ["CASHIER"]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The user's new role assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: LAST_OWNER -- the change would leave no active Owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  # ── Payments ──────────────────────────────────────────────────────
  /payments/mpesa/stk-push:
    post:
      tags: [Payments]
      summary: Collect a payment by M-Pesa STK push
      description: >
        Requires `payments:create`. Sends a PIN prompt to the customer's
        phone and returns 202 with a PENDING payment. On confirmed success
        the server posts Dr `receivedAccountId` (default: the business's
        M-Pesa account, created if missing) / Cr `creditAccountId`
        (tagged with `customerId` if given), with any included VAT
        (`taxAmountMinor`) credited to `taxAccountId` instead. A repeat with the same
        `clientUuid` never prompts twice: 409 without an Idempotency-Key,
        the original response with one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStkPushRequest'
            example:
              clientUuid: "7d2c1e0a-5b6f-4a8e-9c3d-2f1e0a9b8c7d"
              phone: "0712345678"
              currency: KES
              amountMinor: 150000
              creditAccountId: "2b3c4d5e-6f70-4a10-9c1a-4a2b4c1a9c1b"
              accountReference: "INV-0042"
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '202':
          description: Prompt sent; the payment is PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateValue'
        '502':
          description: PAYMENT_PROVIDER_ERROR -- M-Pesa refused or couldn't be reached; the payment is recorded as FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: PAYMENTS_NOT_CONFIGURED -- M-Pesa credentials aren't set on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /payments:
    get:
      tags: [Payments]
      summary: List recent payments
      description: "Requires `payments:view`. Newest first, at most 200."
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get a payment (poll this for the outcome)
      description: >
        Requires `payments:view`. If the payment has been PENDING for over
        a minute, the server re-checks it with Daraja before answering, so
        a lost callback still resolves.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /hooks/stk/{tenantId}/{paymentId}/{token}:
    post:
      tags: [Provider Callbacks]
      summary: M-Pesa STK callback (called by Safaricom)
      description: >
        Not for apps. The URL is generated per payment and handed to
        Daraja; the final segment is a one-off secret. A wrong secret,
        unknown payment or mismatched CheckoutRequestID gets 404. Repeats
        are acknowledged and ignored.
      security: []
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Daraja's stkCallback payload ({ Body: { stkCallback: {...} } }).
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              example: { ResultCode: 0, ResultDesc: Accepted }
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Roles ─────────────────────────────────────────────────────────
  /roles:
    get:
      tags: [Roles]
      summary: List built-in and custom roles
      description: "Requires `roles:view`. Built-in roles come first; their `id` is their key (e.g. `CASHIER`)."
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: All roles available in this tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Roles]
      summary: Create a custom role
      description: "Requires `roles:create`. Names are unique per tenant, case-insensitively (409 otherwise)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              name: Stock Clerk
              description: Records supplier bills
              permissions: ["suppliers:view", "bills:create"]
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateValue'

  /roles/permissions:
    get:
      tags: [Roles]
      summary: List the permission catalogue
      description: "Requires `roles:view`. Every permission a custom role can be composed from."
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The permission catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/RoleIdPath'
    get:
      tags: [Roles]
      summary: Get a role
      description: "Requires `roles:view`."
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Roles]
      summary: Update a custom role
      description: >
        Requires `roles:edit`. Send any of name, description, permissions
        (permissions replaces the whole list). Built-in roles return 422
        ROLE_IMMUTABLE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The updated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: ROLE_IMMUTABLE -- built-in roles cannot be changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /roles/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/RoleIdPath'
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Roles]
      summary: Deactivate a custom role
      description: >
        Requires `roles:edit`. The role stays assigned to its users but
        grants nothing until reactivated, and can't be newly assigned.
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The deactivated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /roles/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/RoleIdPath'
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Roles]
      summary: Reactivate a custom role
      description: "Requires `roles:edit`."
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: The reactivated role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Invites ───────────────────────────────────────────────────────
  /invites:
    post:
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      tags: [Invites]
      summary: Invite a new user to the caller's tenant
      description: >
        Sends a real email (via Resend) containing an accept link. The new
        person does not need to exist in our system yet -- that's exactly
        what accepting the invite creates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
            example:
              email: "colleague@example.com"
              name: "Colleague Name"
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '201':
          description: Invite created and emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Invites]
      summary: List invites for the caller's tenant
      responses:
        '403':
          $ref: '#/components/responses/Forbidden'
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invite'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /invites/{token}:
    get:
      tags: [Invites]
      summary: Preview an invite (public -- no authentication at all)
      description: >
        Shown to the invitee BEFORE they have logged in anywhere. Returns
        only the tenant name, inviter name, and status -- nothing sensitive.
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteTokenPath'
      responses:
        '200':
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          $ref: '#/components/responses/NotFound'

  /invites/{token}/accept:
    post:
      tags: [Invites]
      summary: Accept an invite
      description: >
        Requires a genuine Auth0 token (same tier as /onboarding) but NOT
        an already-provisioned platform user -- accepting IS what creates
        that user. The new user's external_idp_subject comes from the
        verified token's sub claim, never from the request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InviteTokenPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '201':
          description: Invite accepted; user created in the invite's tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInviteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invite not found, or the token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Invite no longer valid (already accepted/revoked/expired), or this identity is already provisioned elsewhere
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "tag:jibuks,2026:error/USER_ALREADY_EXISTS"
                title: "USER_ALREADY_EXISTS"
                status: 409
                detail: "This identity already has an account (user ..., tenant ...)"

  # ── Accounts ──────────────────────────────────────────────────────
