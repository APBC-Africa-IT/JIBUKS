services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: jibuks_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    ports:
      # Bound to localhost only -- Postgres itself is never exposed to the
      # public internet directly, only reachable from other containers on
      # the internal Docker network, or via SSH tunnel if ever needed.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      # Caddy is the only thing that reaches this from outside the
      # container network now that a domain + TLS are configured.
      - "127.0.0.1:3000:3000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    entrypoint: ["node_modules/.bin/node-pg-migrate"]
    command: ["up"]
    environment:
      # Migrations run as the migrator role, not the app role -- same
      # separation of privilege as local development (macbook vs jibuks_app).
      DATABASE_URL: ${MIGRATION_DATABASE_URL}
    profiles:
      # "profiles" means this service is NEVER started by a plain
      # `docker compose up` -- only explicitly, via
      # `docker compose run --rm migrate`, when we actually want to migrate.
      - tools

volumes:
  pgdata:
